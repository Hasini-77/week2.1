
<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            text-align: left;
        }

        h2 {
            text-align: center;
        }

        input {
            margin: 5px;
        }

        button {
            display: block;
            margin: 10px auto;
        }
    </style>
</head>

<body>

    <form method="POST" action="/register">

        <h2>Register</h2>

        <label>Name:</label>
        <input type="text" name="name" required><br><br>

        <label>Email:</label>
        <input type="email" name="email" required><br><br>

        <label>Course:</label>
        <input type="text" name="course" required><br><br>

        <button type="submit">Register</button>

    </form>

</body>
</html>
